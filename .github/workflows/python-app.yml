name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # allows manual trigger

permissions:
  contents: write   # needed for release uploads

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ✅ opt into Node.js 24 now

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4   # ✅ already supports Node.js 24
    - name: Set up Python 3.10
      uses: actions/setup-python@v5   # ✅ upgraded from v3 → v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: pytest

  release:
    runs-on: windows-latest   # build exe on Windows runner
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Build exe with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "Random Spinner Game" --icon=gameicon.ico "Random Spinner Game.py"
    - name: Upload exe artifact
      uses: actions/upload-artifact@v4
      with:
        name: RandomSpinnerGame
        path: dist/Random Spinner Game.exe
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/Random Spinner Game.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
