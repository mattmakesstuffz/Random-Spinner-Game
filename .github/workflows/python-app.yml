name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash
    - name: Lint with flake8 (non-blocking)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      shell: bash
    - name: Test with pytest (non-blocking)
      run: |
        pytest || true
      shell: bash

  release:
    runs-on: windows-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies (Windows-safe)
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
      shell: powershell
    - name: Build exe with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "Random Spinner Gamee" --icon=ICONBUTFORSHORTCUT.ICO "Random Spinner Gamee.py"
      shell: powershell
    - name: Sign exe with PowerShell
      run: |
        $pwd = ConvertTo-SecureString -String "password123" -Force -AsPlainText
        $cert = New-SelfSignedCertificate -Type CodeSigning -Subject "CN=MoonFlower" -CertStoreLocation Cert:\CurrentUser\My
        Export-PfxCertificate -Cert $cert -FilePath MoonFlowerCert.pfx -Password $pwd
        Import-PfxCertificate -FilePath MoonFlowerCert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
        Set-AuthenticodeSignature -FilePath "dist\Random Spinner Gamee.exe" -Certificate $cert
      shell: powershell
    - name: Commit exe to main branch
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        cp "dist/Random Spinner Gamee.exe" .
        git add "Random Spinner Gamee.exe"
        git commit -m "Add signed exe to main branch"
        git push origin HEAD:main
      shell: bash
